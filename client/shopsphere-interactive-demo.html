<html lang="en">
<head>

<title>ShopSphere — Interactive UI Demo</title>
<style>
:root{--primary:#881337;--secondary:#9F1239;--gold:#B68D40;--deep:#4C0519;--bg:#f8f5f5;--card:#fff;--text:#24191d;--muted:#82747a;--line:#eadfe3;--soft:#f6e9ed;--green:#16845b;--amber:#b7791f;--red:#c0394b;--shadow:0 12px 32px #4c05190c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.wrap{max-width:1440px;margin:auto;padding:0 28px}.topbar{background:var(--deep);color:#fff;padding:8px 28px;text-align:center;font-size:12px;letter-spacing:.3px}.navbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.navinner{max-width:1440px;margin:auto;padding:15px 28px;display:flex;align-items:center;gap:26px}.logo{font-weight:900;font-size:22px;letter-spacing:-.7px;color:var(--primary);white-space:nowrap}.logo span{color:var(--gold)}.navlinks{display:flex;gap:20px;align-items:center;flex:1}.navlinks a,.navlinks button{border:0;background:none;color:#55464c;font-weight:600}.navlinks a:hover,.navlinks button:hover{color:var(--primary)}.navtools{display:flex;gap:9px;align-items:center}.iconbtn,.outlinebtn{border:1px solid var(--line);background:white;color:var(--text);border-radius:10px;padding:9px 12px}.primarybtn{border:0;border-radius:10px;background:var(--primary);color:white;padding:10px 16px;font-weight:700;box-shadow:0 5px 12px #88133720}.primarybtn:hover{background:var(--deep)}.goldbtn{background:var(--gold);color:#fff}.dangerbtn{background:#fff0f1;color:var(--red);border:1px solid #f3cbd0;border-radius:9px;padding:8px 12px}.page{max-width:1440px;margin:auto;padding:28px}.hero{border-radius:24px;overflow:hidden;background:linear-gradient(115deg,#4c0519,#881337 60%,#b68d40);color:#fff;padding:60px 6%;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;min-height:340px}.hero h1{font-size:clamp(34px,4vw,58px);line-height:1.05;margin:12px 0}.hero p{color:#f5dfe6;max-width:520px;font-size:16px}.heroart{height:245px;border:1px solid #ffffff30;border-radius:22px;background:radial-gradient(circle at 70% 35%,#e8bf75 0 8%,transparent 9%),radial-gradient(circle at 35% 65%,#d7a7a9 0 17%,transparent 18%),linear-gradient(145deg,#ffffff25,#ffffff05);display:grid;place-items:center;font-size:82px}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:34px 0 16px}.sectionhead h2{margin:0;font-size:25px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.product{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.2s;box-shadow:var(--shadow)}.product:hover{transform:translateY(-3px);box-shadow:0 16px 30px #4c05191a}.productvisual{height:175px;background:linear-gradient(140deg,#f7e9ed,#ead7dd);display:grid;place-items:center;font-size:65px;position:relative}.productvisual .tag{position:absolute;left:12px;top:12px;background:#fff;color:var(--primary);font-size:10px;font-weight:800;padding:5px 8px;border-radius:20px}.productbody{padding:14px}.productbody h3{font-size:14px;margin:5px 0}.price{font-weight:900;color:var(--primary);font-size:17px}.oldprice{text-decoration:line-through;color:#a99ca1;font-size:12px;margin-left:6px}.rating{color:#a87920;font-size:12px}.productactions{display:flex;gap:8px;margin-top:12px}.productactions button{flex:1}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:var(--soft);color:var(--primary);font-size:11px;font-weight:800}.categorygrid{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}.category{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer}.category:hover{border-color:var(--primary);background:var(--soft)}.category b{display:block;margin-top:8px}.footer{background:#2a101a;color:#f9eaf0;padding:42px 28px;margin-top:55px}.footerinner{max-width:1384px;margin:auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px}.footer a{display:block;color:#d9c4cc;margin:8px 0}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px;align-items:start}.sidebar,.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.sidebar{padding:16px;position:sticky;top:88px}.side-title{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:1.3px;text-transform:uppercase;margin:10px 10px}.side-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#65565c;font-weight:600;margin:3px 0;cursor:pointer}.side-link:hover,.side-link.active{background:var(--soft);color:var(--primary)}.content{min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 20px}.pagehead h1{font-size:27px;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{padding:17px}.stat .label{color:var(--muted);font-size:12px;font-weight:700}.stat strong{display:block;font-size:27px;margin:5px 0}.stat .trend{font-size:11px;color:var(--green)}.panel{padding:20px;margin-bottom:18px}.panel h2{font-size:17px;margin:0 0 14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #f0e8eb}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;background:#fcf9fa}td{font-size:13px}.status{display:inline-block;border-radius:20px;padding:4px 9px;font-size:11px;font-weight:800;background:#f4e9ed;color:var(--primary)}.status.green{background:#e7f6ef;color:#16845b}.status.amber{background:#fff4df;color:#9b6814}.status.red{background:#ffeaec;color:#bd3345}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.field{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 12px;border-radius:9px;min-width:150px;outline:none}.field:focus{border-color:var(--primary);box-shadow:0 0 0 3px #88133715}.field.full{width:100%}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.formgroup label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.formgroup textarea{min-height:90px;resize:vertical}.btnsm{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:white;font-weight:700;font-size:12px}.btnsm.primary{background:var(--primary);border-color:var(--primary);color:white}.btnsm:hover{border-color:var(--primary);color:var(--primary)}.btnsm.primary:hover{color:white;background:var(--deep)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:9px;color:var(--muted);font-weight:700}.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}.twocol{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.barrow{display:flex;align-items:center;gap:10px;margin:13px 0}.bar{height:8px;border-radius:10px;background:#f1e6ea;flex:1;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary);border-radius:10px}.modalback{position:fixed;inset:0;background:#1b0a11a8;display:grid;place-items:center;padding:20px;z-index:80}.modal{background:#fff;border-radius:18px;padding:24px;width:min(520px,100%);box-shadow:0 25px 80px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}.toast{position:fixed;bottom:22px;right:22px;background:#2a101a;color:#fff;padding:13px 18px;border-radius:11px;z-index:100;box-shadow:0 8px 30px #0003}.empty{text-align:center;padding:55px 20px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:18px;margin:8px}.breadcrumbs{color:var(--muted);font-size:12px;margin-bottom:15px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:28px}.detailvisual{min-height:370px;border-radius:18px;background:linear-gradient(140deg,#f7e9ed,#e8d1d9);display:grid;place-items:center;font-size:130px}.qty{display:flex;align-items:center;gap:12px;margin:16px 0}.qty button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px}.cartrow{display:grid;grid-template-columns:65px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.cartthumb{height:62px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:28px}.authbox{max-width:460px;margin:30px auto;background:white;padding:28px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.authbox h1{margin-top:0}.notice{background:#fff8e9;border:1px solid #f0dfb9;color:#76571d;padding:12px;border-radius:10px;font-size:12px}.mobilemenu{display:none}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.categorygrid{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:205px 1fr}.navlinks{gap:10px}.navlinks a:nth-child(n+4){display:none}}
@media(max-width:700px){.wrap,.page{padding:18px}.navinner{padding:12px 16px;gap:12px}.navlinks{display:none}.hero{grid-template-columns:1fr;padding:35px 25px}.heroart{height:150px}.grid{grid-template-columns:repeat(2,1fr);gap:11px}.productvisual{height:135px}.layout{grid-template-columns:1fr}.sidebar{position:static;display:none}.sidebar.open{display:block}.mobilemenu{display:inline-block}.stats{grid-template-columns:repeat(2,1fr)}.categorygrid{grid-template-columns:repeat(3,1fr)}.twocol,.detail{grid-template-columns:1fr}.footerinner{grid-template-columns:1fr 1fr}.pagehead{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.navtools .hide-mobile{display:none}.wrap{padding:0 16px}}
</style>
</head>
<body>
<div class="topbar">LUXURY FINDS, EVERYDAY PRICES · FREE SHIPPING ON ORDERS ABOVE ₹999</div>
<header class="navbar"><div class="navinner">
<a class="logo" href="#" onclick="go('home');return false">Shop<span>Sphere</span>.</a>
<nav class="navlinks"><a href="#" onclick="go('home');return false">Home</a><a href="#" onclick="go('shop');return false">Shop</a><a href="#" onclick="go('categories');return false">Categories</a><a href="#" onclick="go('deals');return false">Deals</a><a href="#" onclick="go('about');return false">About</a></nav>
<div class="navtools"><button class="iconbtn hide-mobile" onclick="go('wishlist')">♡ Wishlist</button><button class="iconbtn" onclick="go('cart')">🛍 Cart <b id="cartCount">0</b></button><select class="field" style="min-width:0;padding:8px" onchange="switchRole(this.value)"><option value="public">Public</option><option value="customer">Customer</option><option value="vendor">Vendor</option><option value="admin">Admin</option></select><button class="primarybtn hide-mobile" onclick="go('login')">Sign in</button><button class="iconbtn mobilemenu" onclick="document.getElementById('mobileNav').classList.toggle('hidden')">☰</button></div>
</div><div id="mobileNav" class="hidden" style="padding:10px 18px;background:#fff"><button class="btnsm" onclick="go('home')">Home</button> <button class="btnsm" onclick="go('shop')">Shop</button> <button class="btnsm" onclick="go('customer-dashboard')">Account</button> <button class="btnsm" onclick="go('admin-dashboard')">Admin</button></div></header>
<div id="app"></div><div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const products=[
{id:1,name:"Classic Leather Tote",cat:"Fashion",price:2499,old:3299,icon:"👜",rating:4.8,tag:"BESTSELLER",desc:"A refined everyday tote crafted for timeless style and practical elegance."},
{id:2,name:"Aura Ceramic Table Lamp",cat:"Home & Living",price:1899,old:2499,icon:"💡",rating:4.6,tag:"NEW",desc:"Warm ambient lighting with a minimal ceramic silhouette."},
{id:3,name:"Studio Wireless Headphones",cat:"Electronics",price:3499,old:4499,icon:"🎧",rating:4.7,tag:"POPULAR",desc:"Immersive sound, soft cushions and all-day comfort."},
{id:4,name:"Minimal Gold Watch",cat:"Accessories",price:2799,old:3999,icon:"⌚",rating:4.5,tag:"LIMITED",desc:"A sleek gold-tone watch for a polished everyday look."},
{id:5,name:"Botanical Skin Care Set",cat:"Beauty",price:1299,old:1799,icon:"🧴",rating:4.9,tag:"TOP RATED",desc:"A gentle daily-care set inspired by botanical ingredients."},
{id:6,name:"Everyday Sneakers",cat:"Fashion",price:2199,old:2999,icon:"👟",rating:4.4,tag:"SALE",desc:"Lightweight comfort with a clean versatile design."},
{id:7,name:"Oak Desk Organizer",cat:"Home & Living",price:899,old:1199,icon:"🗃️",rating:4.3,tag:"",desc:"Keep your workspace tidy with a warm oak finish."},
{id:8,name:"Smart Fitness Band",cat:"Electronics",price:1599,old:2199,icon:"⌚",rating:4.2,tag:"TRENDING",desc:"Track your daily activity with a lightweight smart band."}
];
let cart=[],wishlist=[1,4],currentProduct=products[0],qty=1,role="public",activePage="home",filterCat="All",searchTerm="",orders=[
{id:"#SS-10482",customer:"Riya Sharma",date:"11 Nov 2026",amount:4298,status:"Processing"},
{id:"#SS-10481",customer:"Arjun Verma",date:"10 Nov 2026",amount:1899,status:"Shipped"},
{id:"#SS-10480",customer:"Neha Singh",date:"09 Nov 2026",amount:3499,status:"Delivered"},
{id:"#SS-10479",customer:"Kabir Das",date:"08 Nov 2026",amount:1299,status:"Pending"}
],users=[["U-1001","Riya Sharma","riya@email.com","Customer","Active"],["U-1002","Arjun Verma","arjun@email.com","Customer","Active"],["U-1003","Northstar Store","vendor@email.com","Vendor","Pending"],["U-1004","Neha Singh","neha@email.com","Customer","Blocked"]],tickets=[["#TK-201","Payment not updated","Payment","Open"],["#TK-202","Order delivery delay","Delivery","Pending"],["#TK-203","Product exchange request","Order","Resolved"]];
const money=n=>"₹"+Number(n).toLocaleString("en-IN");
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2200)}
function go(page){activePage=page;render();window.scrollTo(0,0)}
function switchRole(r){role=r;if(r==="admin")go("admin-dashboard");else if(r==="vendor")go("vendor-dashboard");else if(r==="customer")go("customer-dashboard");else go("home")}
function addCart(id){let p=products.find(x=>x.id===id),line=cart.find(x=>x.id===id);line?line.qty++:cart.push({...p,qty:1});updateCart();toast("Added to cart")}
function updateCart(){document.getElementById("cartCount").textContent=cart.reduce((s,x)=>s+x.qty,0)}
function toggleWish(id){wishlist.includes(id)?wishlist=wishlist.filter(x=>x!==id):wishlist.push(id);toast(wishlist.includes(id)?"Added to wishlist":"Removed from wishlist");render()}
function productCard(p){return `<article class="product"><div class="productvisual" onclick="openProduct(${p.id})"><span>${p.icon}</span>${p.tag?`<span class="tag">${p.tag}</span>`:""}</div><div class="productbody"><div class="rating">★★★★★ <span class="muted">(${p.rating})</span></div><h3 onclick="openProduct(${p.id})" style="cursor:pointer">${p.name}</h3><div><span class="price">${money(p.price)}</span><span class="oldprice">${money(p.old)}</span></div><div class="productactions"><button class="primarybtn" onclick="addCart(${p.id})">Add to cart</button><button class="outlinebtn" onclick="toggleWish(${p.id})">${wishlist.includes(p.id)?"♥":"♡"}</button></div></div></article>`}
function openProduct(id){currentProduct=products.find(p=>p.id===id);qty=1;go("product")}
function footer(){return `<footer class="footer"><div class="footerinner"><div><div class="logo" style="color:white">Shop<span>Sphere</span>.</div><p style="max-width:300px;color:#d9c4cc">A thoughtful shopping experience for everyday essentials and timeless finds.</p><p class="small">© 2026 ShopSphere. Demo storefront.</p></div><div><b>Explore</b><a onclick="go('shop')">Shop all</a><a onclick="go('categories')">Categories</a><a onclick="go('deals')">Special offers</a></div><div><b>Customer care</b><a onclick="go('support')">Help & Support</a><a onclick="go('orders')">Track order</a><a onclick="go('returns')">Returns</a></div><div><b>Your account</b><a onclick="go('login')">Sign in</a><a onclick="go('wishlist')">Wishlist</a><a onclick="go('customer-dashboard')">My account</a></div></div></footer>`}
function home(){return `<main class="page"><section class="hero"><div><div class="eyebrow">The curated collection · 2026</div><h1>Find your next<br>favourite thing.</h1><p>Discover thoughtful essentials, elevated everyday style and pieces made to make life feel a little more special.</p><button class="primarybtn goldbtn" onclick="go('shop')">Explore collection →</button> <button class="outlinebtn" style="background:#ffffff16;color:white;border-color:#ffffff55" onclick="go('deals')">View offers</button></div><div class="heroart">🛍️</div></section><div class="sectionhead"><div><div class="eyebrow">Browse by style</div><h2>Shop categories</h2></div><a onclick="go('categories')" style="color:var(--primary);font-weight:800;cursor:pointer">View all →</a></div><div class="categorygrid">${["Fashion","Electronics","Home & Living","Beauty","Accessories","Lifestyle"].map((c,i)=>`<div class="category" onclick="filterCategory('${c}')"><div style="font-size:30px">${["👗","🎧","🏡","🌿","⌚","✨"][i]}</div><b>${c}</b></div>`).join("")}</div><div class="sectionhead"><div><div class="eyebrow">Handpicked for you</div><h2>Featured products</h2></div><a onclick="go('shop')" style="color:var(--primary);font-weight:800;cursor:pointer">Shop all →</a></div><div class="grid">${products.slice(0,4).map(productCard).join("")}</div><div class="panel" style="margin-top:28px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:15px"><div><div class="eyebrow">A little something extra</div><h2 style="margin:4px 0">Enjoy 10% off your first order</h2><p class="muted" style="margin:0">Use code <b>WELCOME10</b> at checkout.</p></div><button class="primarybtn" onclick="toast('WELCOME10 copied in demo')">Copy offer</button></div></main>${footer()}`}
function filterCategory(c){filterCat=c;go("shop")}
function shop(){let list=products.filter(p=>(filterCat==="All"||p.cat===filterCat)&&(`${p.name} ${p.cat}`).toLowerCase().includes(searchTerm.toLowerCase()));return `<main class="page"><div class="breadcrumbs">Home / Shop</div><div class="pagehead"><div><div class="eyebrow">The collection</div><h1>Shop all products</h1><p class="muted">Find pieces you'll love, curated for everyday living.</p></div><span class="pill">${list.length} products</span></div><div class="toolbar"><input class="field" placeholder="Search products..." value="${searchTerm}" oninput="searchTerm=this.value;renderShopGrid()"><select class="field" onchange="filterCat=this.value;renderShopGrid()">${["All","Fashion","Electronics","Home & Living","Beauty","Accessories"].map(c=>`<option ${filterCat===c?"selected":""}>${c}</option>`).join("")}</select><select class="field" onchange="sortProducts(this.value)"><option value="default">Sort: Featured</option><option value="low">Price: Low to high</option><option value="high">Price: High to low</option></select></div><div id="shopGrid" class="grid">${list.map(productCard).join("")||`<div class="empty" style="grid-column:1/-1">No products found.</div>`}</div></main>${footer()}`}
function renderShopGrid(){let el=document.getElementById("shopGrid");if(!el)return;let list=products.filter(p=>(filterCat==="All"||p.cat===filterCat)&&(`${p.name} ${p.cat}`).toLowerCase().includes(searchTerm.toLowerCase()));el.innerHTML=list.map(productCard).join("")||`<div class="empty" style="grid-column:1/-1">No products found.</div>`}
function sortProducts(v){if(v==="low")products.sort((a,b)=>a.price-b.price);if(v==="high")products.sort((a,b)=>b.price-a.price);renderShopGrid()}
function categories(){return `<main class="page"><div class="eyebrow">Explore</div><h1>All categories</h1><p class="muted">Browse our collections and find exactly what you're looking for.</p><div class="categorygrid" style="margin-top:25px">${["Fashion","Electronics","Home & Living","Beauty","Accessories","Lifestyle"].map((c,i)=>`<div class="category" onclick="filterCategory('${c}')"><div style="font-size:45px">${["👗","🎧","🏡","🌿","⌚","✨"][i]}</div><b>${c}</b><p class="small muted">Explore collection →</p></div>`).join("")}</div></main>${footer()}`}
function productPage(){let p=currentProduct;return `<main class="page"><div class="breadcrumbs"><a onclick="go('home')">Home</a> / <a onclick="go('shop')">Shop</a> / ${p.name}</div><div class="detail"><div class="detailvisual">${p.icon}</div><div><span class="pill">${p.cat}</span><h1 style="font-size:34px;margin:12px 0">${p.name}</h1><div class="rating">★★★★★ <span class="muted">${p.rating} · 124 reviews</span></div><p class="price" style="font-size:27px;margin:18px 0">${money(p.price)} <span class="oldprice">${money(p.old)}</span></p><p class="muted">${p.desc}</p><p class="small muted">✓ In stock · ✓ Secure checkout · ✓ Easy returns</p><div class="qty"><b>Quantity</b><button onclick="qty=Math.max(1,qty-1);document.getElementById('qtyval').textContent=qty">−</button><b id="qtyval">${qty}</b><button onclick="qty++;document.getElementById('qtyval').textContent=qty">+</button></div><button class="primarybtn" onclick="for(let i=0;i<qty;i++)addCart(${p.id});go('cart')">Add to cart</button> <button class="outlinebtn" onclick="toggleWish(${p.id})">♡ Wishlist</button><div class="panel" style="margin-top:22px"><b>Product details</b><p class="muted small">Quality checked · Secure packaging · Delivered in 3–6 business days.</p></div></div></div><div class="sectionhead"><h2>You may also like</h2></div><div class="grid">${products.filter(x=>x.id!==p.id).slice(0,4).map(productCard).join("")}</div></main>${footer()}`}
function cartPage(){let total=cart.reduce((s,x)=>s+x.price*x.qty,0);return `<main class="page"><div class="eyebrow">Your bag</div><h1>Shopping cart</h1>${cart.length?`<div class="twocol"><section class="panel">${cart.map(x=>`<div class="cartrow"><div class="cartthumb">${x.icon}</div><div><b>${x.name}</b><div class="muted small">${money(x.price)} each</div><div class="qty" style="margin:5px 0"><button onclick="changeQty(${x.id},-1)">−</button><b>${x.qty}</b><button onclick="changeQty(${x.id},1)">+</button></div></div><div><b>${money(x.price*x.qty)}</b><br><button class="btnsm" onclick="removeCart(${x.id})">Remove</button></div></div>`).join("")}<button class="outlinebtn" style="margin-top:15px" onclick="go('shop')">← Continue shopping</button></section><aside class="panel"><h2>Order summary</h2><div class="barrow"><span>Subtotal</span><b style="margin-left:auto">${money(total)}</b></div><div class="barrow"><span>Shipping</span><b style="margin-left:auto">${total>999?"FREE":money(79)}</b></div><hr style="border:0;border-top:1px solid var(--line)"><div class="barrow"><b>Total</b><b style="margin-left:auto;color:var(--primary);font-size:21px">${money(total+(total>999?0:79))}</b></div><input id="coupon" class="field full" placeholder="Coupon code" style="margin:10px 0"><button class="outlinebtn" style="width:100%" onclick="applyCoupon()">Apply coupon</button><button class="primarybtn" style="width:100%;margin-top:10px" onclick="go('checkout')">Proceed to checkout →</button></aside></div>`:`<div class="panel empty"><div style="font-size:55px">🛍️</div><b>Your cart is empty</b><p>Looks like you haven't added anything yet.</p><button class="primarybtn" onclick="go('shop')">Start shopping</button></div>`}</main>${footer()}`}
function changeQty(id,d){let x=cart.find(x=>x.id===id);if(x){x.qty+=d;if(x.qty<1)cart=cart.filter(y=>y.id!==id);updateCart();render()}}
function removeCart(id){cart=cart.filter(x=>x.id!==id);updateCart();render();toast("Item removed")}
function applyCoupon(){let c=document.getElementById("coupon").value.trim();toast(c.toUpperCase()==="WELCOME10"?"Coupon applied — 10% off (demo)":"Invalid coupon code")}
function wishlistPage(){let list=products.filter(p=>wishlist.includes(p.id));return `<main class="page"><div class="eyebrow">Saved for later</div><h1>My wishlist</h1><p class="muted">Your favourite finds, all in one place.</p><div class="grid" style="margin-top:22px">${list.map(productCard).join("")||`<div class="panel empty" style="grid-column:1/-1"><b>Your wishlist is empty</b><button class="primarybtn" onclick="go('shop')">Explore products</button></div>`}</div></main>${footer()}`}
function login(){return `<main class="page"><div class="authbox"><div class="logo">Shop<span>Sphere</span>.</div><h1>Welcome back</h1><p class="muted">Sign in to continue to your account.</p><div class="formgroup"><label>Email address</label><input class="field full" id="loginEmail" type="email" placeholder="you@example.com"></div><div class="formgroup" style="margin-top:12px"><label>Password</label><input class="field full" type="password" placeholder="Enter password"></div><div style="display:flex;justify-content:space-between;margin:12px 0"><label class="small"><input type="checkbox"> Remember me</label><a class="small" style="color:var(--primary)" onclick="toast('Password reset demo')">Forgot password?</a></div><button class="primarybtn" style="width:100%" onclick="demoLogin()">Sign in</button><p class="small muted" style="text-align:center">New here? <a style="color:var(--primary);font-weight:800" onclick="go('register')">Create an account</a></p><div class="notice">Demo mode: choose a workspace from the role selector in the top navigation. No real authentication is performed.</div></div></main>${footer()}`}
function demoLogin(){let e=document.getElementById("loginEmail").value;if(!e.includes("@"))return toast("Enter a valid demo email");toast("Demo sign-in successful");switchRole(role==="public"?"customer":role)}
function register(){return `<main class="page"><div class="authbox"><h1>Create your account</h1><p class="muted">Join ShopSphere and discover more.</p><div class="formgroup"><label>Full name</label><input class="field full" placeholder="Your name"></div><div class="formgroup" style="margin-top:12px"><label>Email</label><input class="field full" placeholder="you@example.com"></div><div class="formgroup" style="margin-top:12px"><label>Password</label><input class="field full" type="password" placeholder="Create password"></div><button class="primarybtn" style="width:100%;margin-top:18px" onclick="toast('Demo account created')">Create account</button><p class="small muted">Already registered? <a onclick="go('login')" style="color:var(--primary)">Sign in</a></p></div></main>${footer()}`}
function checkout(){let total=cart.reduce((s,x)=>s+x.price*x.qty,0);return `<main class="page"><div class="eyebrow">Almost yours</div><h1>Checkout</h1><div class="twocol"><section><div class="panel"><h2>1. Delivery address</h2><div class="formgrid"><div class="formgroup"><label>Full name</label><input class="field full" placeholder="Full name"></div><div class="formgroup"><label>Phone</label><input class="field full" placeholder="10-digit mobile"></div><div class="formgroup"><label>Address</label><input class="field full" placeholder="House, street, area"></div><div class="formgroup"><label>PIN code</label><input class="field full" placeholder="PIN code"></div><div class="formgroup"><label>City</label><input class="field full" placeholder="City"></div><div class="formgroup"><label>State</label><input class="field full" placeholder="State"></div></div></div><div class="panel"><h2>2. Payment method</h2><label style="display:block;padding:10px"><input type="radio" name="pay" checked> Cash on delivery</label><label style="display:block;padding:10px"><input type="radio" name="pay"> UPI / Cards (demo)</label></div></section><aside class="panel"><h2>Order total</h2>${cart.map(x=>`<div class="barrow"><span>${x.name} × ${x.qty}</span><b style="margin-left:auto">${money(x.price*x.qty)}</b></div>`).join("")}<hr><div class="barrow"><b>Total</b><b style="margin-left:auto;color:var(--primary)">${money(total)}</b></div><button class="primarybtn" style="width:100%" onclick="placeOrder()">Place order</button><p class="small muted">This is a UI demo. No payment will be collected.</p></aside></div></main>${footer()}`}
function placeOrder(){if(!cart.length)return toast("Your cart is empty");orders.unshift({id:"#SS-"+Math.floor(10000+Math.random()*89999),customer:"You",date:"11 Nov 2026",amount:cart.reduce((s,x)=>s+x.price*x.qty,0),status:"Processing"});cart=[];updateCart();toast("Demo order placed successfully");go("order-success")}
function orderSuccess(){return `<main class="page"><div class="panel empty"><div style="font-size:60px">✓</div><span class="pill">ORDER CONFIRMED</span><h1>Thank you for your order!</h1><p>Your demo order has been created successfully.</p><button class="primarybtn" onclick="go('orders')">View my orders</button> <button class="outlinebtn" onclick="go('shop')">Continue shopping</button></div></main>${footer()}`}
function statusClass(s){return s==="Delivered"||s==="Active"||s==="Resolved"||s==="Published"?"green":s==="Pending"||s==="Processing"||s==="Open"?"amber":s==="Blocked"||s==="Cancelled"||s==="Rejected"?"red":""}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function customerLayout(content,title="My Account"){return `<main class="page"><div class="layout"><aside class="sidebar" id="sideNav"><div class="side-title">Customer menu</div>${[["customer-dashboard","▦","Overview"],["profile","♙","My Profile"],["addresses","⌖","Addresses"],["orders","▤","My Orders"],["wishlist","♡","Wishlist"],["notifications","♧","Notifications"],["support","✉","Support tickets"],["chat","☏","Messages"]].map(([p,i,l])=>`<div class="side-link ${activePage===p?"active":""}" onclick="go('${p}')"><span>${i}</span>${l}</div>`).join("")}<div class="side-link" onclick="go('home')">← Back to store</div></aside><section class="content"><div class="pagehead"><div><div class="eyebrow">Customer workspace</div><h1>${title}</h1></div><button class="outlinebtn mobilemenu" onclick="document.getElementById('sideNav').classList.toggle('open')">☰ Menu</button></div>${content}</section></div></main>`}
function customerDashboard(){return customerLayout(`<div class="stats">${[["Total orders",orders.length,"↗ 2 this month"],["Wishlist items",wishlist.length,"Saved products"],["Reward points","450","+50 this week"],["Open tickets",tickets.filter(t=>t[3]==="Open").length,"Need assistance?"]].map(x=>`<div class="stat"><span class="label">${x[0]}</span><strong>${x[1]}</strong><span class="trend">${x[2]}</span></div>`).join("")}</div><div class="twocol"><div class="panel"><h2>Recent orders</h2>${table(["Order","Date","Amount","Status"],orders.slice(0,3).map(o=>[o.id,o.date,money(o.amount),`<span class="status ${statusClass(o.status)}">${o.status}</span>`]))}<button class="btnsm" onclick="go('orders')" style="margin-top:12px">View all orders →</button></div><div class="panel"><h2>Quick actions</h2><p><button class="outlinebtn" onclick="go('shop')">Continue shopping</button></p><p><button class="outlinebtn" onclick="go('addresses')">Manage addresses</button></p><p><button class="outlinebtn" onclick="go('support')">Get support</button></p></div></div>`,"Overview")}
function ordersPage(){return customerLayout(`<div class="panel"><div class="toolbar"><input class="field" placeholder="Search order ID..." oninput="filterTable(this.value,'ordersTable')"><select class="field" onchange="filterOrderStatus(this.value)"><option>All statuses</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Pending</option></select></div><div id="ordersTable">${table(["Order ID","Date","Total","Status","Action"],orders.map(o=>[o.id,o.date,money(o.amount),`<span class="status ${statusClass(o.status)}">${o.status}</span>`,`<button class="btnsm" onclick="viewOrder('${o.id}')">View details</button>`]))}</div></div>`,"My Orders")}
function filterOrderStatus(v){let a=orders.filter(o=>v==="All statuses"||o.status===v);document.getElementById("ordersTable").innerHTML=table(["Order ID","Date","Total","Status","Action"],a.map(o=>[o.id,o.date,money(o.amount),`<span class="status ${statusClass(o.status)}">${o.status}</span>`,`<button class="btnsm" onclick="viewOrder('${o.id}')">View details</button>`]))}
function filterTable(v,id){document.querySelectorAll("#"+id+" tbody tr").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v.toLowerCase())?"":"none")}
function viewOrder(id){let o=orders.find(x=>x.id===id);modal("Order "+id,`<p><b>Order status:</b> <span class="status ${statusClass(o.status)}">${o.status}</span></p><p><b>Order date:</b> ${o.date}</p><p><b>Total:</b> ${money(o.amount)}</p><div class="notice">Demo tracking timeline: Order placed → Confirmed → Packed → Shipped → Delivered.</div>`)}
function profile(){return customerLayout(`<div class="panel"><h2>Personal information</h2><div class="formgrid">${["Full name","Email address","Phone number","Date of birth"].map((x,i)=>`<div class="formgroup"><label>${x}</label><input class="field full" value="${["Aman Kumar Jha","aman@example.com","9876543210","2002-04-18"][i]}"></div>`).join("")}</div><button class="primarybtn" style="margin-top:18px" onclick="toast('Profile saved in demo')">Save changes</button></div>`,"My Profile")}
function addresses(){return customerLayout(`<div class="pagehead"><h2>Saved addresses</h2><button class="primarybtn" onclick="modal('Add new address',addressForm())">+ Add address</button></div><div class="grid" style="grid-template-columns:repeat(2,1fr)"><div class="panel"><span class="pill">DEFAULT · HOME</span><h3>Aman Kumar Jha</h3><p class="muted">Flat 204, Example Residency<br>Dadri, Uttar Pradesh — 203207<br>India · 9876543210</p><button class="btnsm" onclick="modal('Edit address',addressForm())">Edit</button> <button class="btnsm" onclick="toast('Address removed')">Delete</button></div><div class="panel"><span class="pill">WORK</span><h3>Office address</h3><p class="muted">Industrial Area, Wazirpur<br>Delhi — 110052<br>India · 9876543210</p><button class="btnsm" onclick="modal('Edit address',addressForm())">Edit</button> <button class="btnsm" onclick="toast('Address removed')">Delete</button></div></div>`,"Addresses")}
function addressForm(){return `<div class="formgroup"><label>Full name</label><input class="field full" placeholder="Full name"></div><div class="formgroup" style="margin-top:10px"><label>Address</label><textarea class="field full" placeholder="Street, area, city, PIN"></textarea></div><button class="primarybtn" style="margin-top:15px" onclick="closeModal();toast('Address saved')">Save address</button>`}
function notifications(){return customerLayout(`<div class="panel">${[["Your order is confirmed","Order #SS-10482 is being prepared.","2 min ago"],["Special offer for you","Get 10% off with WELCOME10.","Yesterday"],["Wishlist reminder","A saved item is waiting for you.","2 days ago"]].map(n=>`<div class="cartrow"><div class="cartthumb">♧</div><div><b>${n[0]}</b><p class="muted small">${n[1]}</p><span class="small muted">${n[2]}</span></div><button class="btnsm" onclick="toast('Marked as read')">Mark read</button></div>`).join("")}</div>`,"Notifications")}
function support(){return customerLayout(`<div class="pagehead"><div><h2>Support tickets</h2><p class="muted">We're here to help.</p></div><button class="primarybtn" onclick="modal('Create support ticket',ticketForm())">+ Create ticket</button></div><div class="panel">${table(["Ticket","Subject","Category","Status","Action"],tickets.map(t=>[t[0],t[1],t[2],`<span class="status ${statusClass(t[3])}">${t[3]}</span>`,`<button class="btnsm" onclick="modal('${t[0]}', '<p>${t[1]}</p><p>${t[2]}</p><p>Status: ${t[3]}</p>')">View</button>`]))}</div>`,"Support")}
function ticketForm(){return `<div class="formgroup"><label>Subject</label><input id="ticketSubject" class="field full" placeholder="Issue subject"></div><div class="formgroup" style="margin-top:10px"><label>Category</label><select class="field full"><option>General</option><option>Order</option><option>Payment</option><option>Delivery</option></select></div><div class="formgroup" style="margin-top:10px"><label>Message</label><textarea class="field full" placeholder="Describe your issue"></textarea></div><button class="primarybtn" style="margin-top:15px" onclick="tickets.unshift(['#TK-'+(204+tickets.length),document.getElementById('ticketSubject').value||'New support request','General','Open']);closeModal();go('support');toast('Ticket created')">Submit ticket</button>`}
function chat(){return customerLayout(`<div class="panel" style="height:440px;display:flex;flex-direction:column"><div><b>ShopSphere Support</b><span class="status green" style="margin-left:8px">Online</span></div><div id="chatMessages" style="flex:1;overflow:auto;padding:18px 0"><p><span class="pill">Support</span></p><div class="notice" style="max-width:75%">Hello! Welcome to ShopSphere support. How can we help you today?</div></div><div style="display:flex;gap:8px"><input id="chatInput" class="field" style="flex:1" placeholder="Type your message..." onkeydown="if(event.key==='Enter')sendChat()"><button class="primarybtn" onclick="sendChat()">Send</button></div></div>`,"Messages")}
function sendChat(){let i=document.getElementById("chatInput"),m=document.getElementById("chatMessages");if(!i.value.trim())return;m.innerHTML+=`<div style="text-align:right;margin:12px 0"><span style="display:inline-block;background:var(--primary);color:white;padding:10px 14px;border-radius:13px">${i.value.replace(/[<>]/g,"")}</span></div>`;i.value="";m.scrollTop=m.scrollHeight}
function returns(){return customerLayout(`<div class="panel"><h2>Returns & refunds</h2><p class="muted">Select a delivered order to request a return.</p>${orders.filter(o=>o.status==="Delivered").map(o=>`<div class="cartrow"><div><b>${o.id}</b><p class="muted small">${money(o.amount)}</p></div><button class="btnsm primary" onclick="modal('Return request','<p>Tell us why you want to return this order.</p><textarea class=field style=width:100% placeholder=Reason></textarea><button class=primarybtn style=margin-top:12px onclick=closeModal();toast(&#39;Return requested&#39;)>Submit request</button>')">Request return</button></div>`).join("")||`<p class="muted">No delivered orders available for return.</p>`}</div>`,"Returns & Refunds")}
const adminLinks=[["admin-dashboard","▦","Dashboard"],["admin-users","♙","Users"],["admin-vendors","♧","Vendors"],["admin-vendor-requests","✉","Vendor requests"],["admin-products","▣","Products"],["admin-categories","▤","Categories"],["admin-orders","▥","Orders"],["admin-refunds","↩","Refund requests"],["admin-payments","₹","Payments"],["admin-coupons","％","Coupons"],["admin-banners","▧","Banners"],["admin-support","☏","Support"],["admin-settings","⚙","Settings"]];
function adminLayout(content,title){return `<main class="page"><div class="layout"><aside class="sidebar" id="sideNav"><div class="side-title">Admin console</div>${adminLinks.map(([p,i,l])=>`<div class="side-link ${activePage===p?"active":""}" onclick="go('${p}')"><span>${i}</span>${l}</div>`).join("")}<div class="side-link" onclick="go('home')">↗ View storefront</div></aside><section class="content"><div class="pagehead"><div><div class="eyebrow">ShopSphere administration</div><h1>${title}</h1></div><button class="outlinebtn mobilemenu" onclick="document.getElementById('sideNav').classList.toggle('open')">☰ Menu</button></div>${content}</section></div></main>`}
function adminDashboard(){return adminLayout(`<div class="stats">${[["Total revenue","₹2,48,590","+12.8% this month"],["Total orders","1,284","+8.2% this month"],["Customers","8,492","+4.3% this month"],["Pending vendors","12","Needs review"]].map(x=>`<div class="stat"><span class="label">${x[0]}</span><strong>${x[1]}</strong><span class="trend">${x[2]}</span></div>`).join("")}</div><div class="twocol"><div class="panel"><h2>Sales overview</h2><div style="height:180px;display:flex;align-items:end;gap:12px;padding:10px 5px">${[42,60,48,78,56,88,68,95,72,82,64,100].map((v,i)=>`<div style="flex:1;text-align:center"><div style="height:${v}%;background:linear-gradient(var(--secondary),var(--primary));border-radius:6px 6px 0 0;min-height:12px"></div><span class="small muted">${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][i]}</span></div>`).join("")}</div></div><div class="panel"><h2>Order status</h2>${[["Delivered",68],["Processing",18],["Pending",9],["Cancelled",5]].map(x=>`<div class="barrow"><span style="width:90px">${x[0]}</span><div class="bar"><i style="width:${x[1]}%"></i></div><b>${x[1]}%</b></div>`).join("")}</div></div><div class="panel"><h2>Recent orders</h2>${table(["Order","Customer","Date","Amount","Status"],orders.map(o=>[o.id,o.customer,o.date,money(o.amount),`<span class="status ${statusClass(o.status)}">${o.status}</span>`]))}</div>`,"Dashboard")}
function adminUsers(){return adminLayout(`<div class="stats">${[["All users","8,492"],["Customers","8,210"],["Vendors","282"],["Blocked","18"]].map(x=>`<div class="stat"><span class="label">${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}</div><div class="panel"><div class="toolbar"><input class="field" placeholder="Search users..." oninput="filterTable(this.value,'userTable')"><select class="field"><option>All roles</option><option>Customer</option><option>Vendor</option><option>Admin</option></select><button class="primarybtn" onclick="modal('Add user',userForm())">+ Add user</button></div><div id="userTable">${table(["User ID","Name","Email","Role","Status","Action"],users.map((u,i)=>[u[0],u[1],u[2],u[3],`<span class="status ${statusClass(u[4])}">${u[4]}</span>`,`<button class="btnsm" onclick="toggleUser(${i})">${u[4]==="Blocked"?"Unblock":"Block"}</button> <button class="btnsm" onclick="modal('User details','<p>${u[1]}</p><p>${u[2]}</p>')">View</button>`]))}</div></div>`,"Users")}
function toggleUser(i){users[i][4]=users[i][4]==="Blocked"?"Active":"Blocked";go("admin-users");toast("User status updated")}
function userForm(){return `<div class="formgroup"><label>Name</label><input class="field full" placeholder="Name"></div><div class="formgroup"><label>Email</label><input class="field full" placeholder="Email"></div><button class="primarybtn" style="margin-top:15px" onclick="closeModal();toast('Demo user added')">Save user</button>`}
function adminVendors(){return adminLayout(`<div class="panel"><div class="toolbar"><input class="field" placeholder="Search vendors..." oninput="filterTable(this.value,'vendorTable')"><select class="field"><option>All status</option><option>Active</option><option>Pending</option></select></div><div id="vendorTable">${table(["Vendor","Shop","Email","Products","Orders","Status","Action"],[["V-101","Northstar Store","northstar@email.com","42","128","Active"],["V-102","Urban Living","urban@email.com","28","96","Active"],["V-103","Aura Essentials","aura@email.com","0","0","Pending"]].map((v,i)=>[...v.slice(0,5),`<span class="status ${statusClass(v[5])}">${v[5]}</span>`,`<button class="btnsm" onclick="toast('Vendor profile opened')">View</button> <button class="btnsm" onclick="toast('Vendor action saved')">Manage</button>`]))}</div></div>`,"Vendors")}
function vendorRequests(){return adminLayout(`<div class="panel"><h2>Pending applications</h2>${table(["Applicant","Business","Submitted","Documents","Action"],[["Aarav Mehta","Northstar Store","10 Nov 2026","Verified",`<button class="btnsm primary" onclick="requestAction(this,'Approved')">Approve</button> <button class="btnsm" onclick="requestAction(this,'Rejected')">Reject</button>`],["Sana Khan","Aura Essentials","09 Nov 2026","Under review",`<button class="btnsm primary" onclick="requestAction(this,'Approved')">Approve</button> <button class="btnsm" onclick="requestAction(this,'Rejected')">Reject</button>`],["Dev Patel","Urban Finds","08 Nov 2026","Verified",`<button class="btnsm primary" onclick="requestAction(this,'Approved')">Approve</button> <button class="btnsm" onclick="requestAction(this,'Rejected')">Reject</button>`]])}</div>`,"Vendor requests")}
function requestAction(b,s){b.parentElement.innerHTML=`<span class="status ${statusClass(s)}">${s}</span>`;toast("Request "+s.toLowerCase())}
function adminProducts(){return adminLayout(`<div class="panel"><div class="toolbar"><input class="field" placeholder="Search products..." oninput="filterTable(this.value,'productTable')"><select class="field"><option>All statuses</option><option>Published</option><option>Pending approval</option><option>Rejected</option></select><button class="outlinebtn" onclick="toast('Product export prepared in demo')">Export</button></div><div id="productTable">${table(["Product","Category","Price","Vendor","Status","Action"],products.map((p,i)=>[p.name,p.cat,money(p.price),"Northstar Store",`<span class="status ${i%3===0?"amber":"green"}">${i%3===0?"Pending approval":"Published"}</span>`,`<button class="btnsm" onclick="modal('${p.name}','<p>${p.desc}</p><p>Price: ${money(p.price)}</p>')">View</button> <button class="btnsm" onclick="toast('Product approved')">Approve</button>`]))}</div></div>`,"Products")}
function adminCategories(){return adminLayout(`<div class="panel"><div class="pagehead"><h2>Product categories</h2><button class="primarybtn" onclick="modal('Add category','<label>Category name</label><input id=catName class=field style=width:100%><button class=primarybtn style=margin-top:12px onclick=closeModal();toast(&#39;Category added&#39;)>Save</button>')">+ Add category</button></div>${table(["Category","Slug","Products","Status","Action"],["Fashion","Electronics","Home & Living","Beauty","Accessories"].map((c,i)=>[c,c.toLowerCase().replaceAll(" ","-"),[42,28,19,31,16][i],`<span class="status green">Active</span>`,`<button class="btnsm" onclick="toast('Category edited')">Edit</button> <button class="btnsm" onclick="toast('Category archived')">Archive</button>`]))}</div>`,"Categories")}
function adminOrders(){return adminLayout(`<div class="panel"><div class="toolbar"><input class="field" placeholder="Search orders..." oninput="filterTable(this.value,'adminOrderTable')"><select class="field" onchange="filterOrderAdmin(this.value)"><option>All statuses</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Pending</option></select><button class="outlinebtn" onclick="toast('Orders exported')">Export</button></div><div id="adminOrderTable">${table(["Order","Customer","Date","Amount","Status","Action"],orders.map(o=>[o.id,o.customer,o.date,money(o.amount),`<span class="status ${statusClass(o.status)}">${o.status}</span>`,`<button class="btnsm" onclick="viewOrder('${o.id}')">Details</button> <button class="btnsm" onclick="modal('Update order status',statusForm('${o.id}'))">Update</button>`]))}</div></div>`,"Orders")}
function filterOrderAdmin(v){let a=orders.filter(o=>v==="All statuses"||o.status===v);document.getElementById("adminOrderTable").innerHTML=table(["Order","Customer","Date","Amount","Status","Action"],a.map(o=>[o.id,o.customer,o.date,money(o.amount),`<span class="status ${statusClass(o.status)}">${o.status}</span>`,`<button class="btnsm" onclick="viewOrder('${o.id}')">Details</button>`]))}
function statusForm(id){return `<label>New status</label><select id="newStatus" class="field full"><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select><button class="primarybtn" style="margin-top:12px" onclick="let o=orders.find(x=>x.id==='${id}');o.status=document.getElementById('newStatus').value;closeModal();go('admin-orders');toast('Order updated')">Save status</button>`}
function simpleAdmin(title,headers,rows){return adminLayout(`<div class="panel"><div class="toolbar"><input class="field" placeholder="Search..." oninput="filterTable(this.value,'simpleTable')"><button class="primarybtn" onclick="toast('New ${title.toLowerCase()} form opened')">+ Add new</button></div><div id="simpleTable">${table(headers,rows)}</div></div>`,title)}
function adminRefunds(){return simpleAdmin("Refund requests",["Request","Order","Customer","Amount","Reason","Status","Action"],[["RF-101","#SS-10470","Riya Sharma","₹2,499","Damaged item",'<span class="status amber">Pending</span>','<button class="btnsm primary" onclick="toast(&#39;Refund approved&#39;)">Approve</button> <button class="btnsm" onclick="toast(&#39;Refund rejected&#39;)">Reject</button>'],["RF-102","#SS-10461","Kabir Das","₹899","Wrong item",'<span class="status green">Approved</span>','<button class="btnsm">View</button>']])}
function adminPayments(){return simpleAdmin("Payments",["Payment ID","Order","Method","Amount","Date","Status"],[["PAY-201","#SS-10482","UPI","₹4,298","11 Nov 2026",'<span class="status green">Success</span>'],["PAY-202","#SS-10481","Card","₹1,899","10 Nov 2026",'<span class="status green">Success</span>'],["PAY-203","#SS-10480","COD","₹3,499","09 Nov 2026",'<span class="status amber">Pending</span>']])}
function adminCoupons(){return simpleAdmin("Coupons",["Code","Discount","Usage","Expiry","Status","Action"],[["WELCOME10","10%","428","31 Dec 2026",'<span class="status green">Active</span>','<button class="btnsm" onclick="toast(&#39;Coupon edited&#39;)">Edit</button>'],["FESTIVE20","20%","182","30 Nov 2026",'<span class="status amber">Scheduled</span>','<button class="btnsm" onclick="toast(&#39;Coupon edited&#39;)">Edit</button>']])}
function adminBanners(){return simpleAdmin("Banners",["Preview","Title","Placement","Schedule","Status","Action"],[["🖼️","Festive collection","Homepage hero","Nov 1–30",'<span class="status green">Active</span>','<button class="btnsm" onclick="toast(&#39;Banner edited&#39;)">Edit</button>'],["🖼️","New arrivals","Shop page","Nov 10–20",'<span class="status amber">Scheduled</span>','<button class="btnsm">Edit</button>']])}
function adminSupport(){return simpleAdmin("Support",["Ticket","Customer","Subject","Priority","Status","Action"],tickets.map(t=>[t[0],"Aman Jha",t[1],t[2],`<span class="status ${statusClass(t[3])}">${t[3]}</span>`,`<button class="btnsm" onclick="modal('${t[0]}','<p>${t[1]}</p><textarea class=field style=width:100% placeholder=Reply></textarea><button class=primarybtn onclick=closeModal();toast(&#39;Reply sent&#39;)>Send reply</button>')">Open</button>`]))}
function adminSettings(){return adminLayout(`<div class="panel"><h2>Store settings</h2><div class="formgrid">${[["Store name","ShopSphere"],["Support email","support@shopsphere.demo"],["Currency","INR (₹)"],["Timezone","Asia/Kolkata"],["Shipping threshold","999"],["Contact number","+91 98765 43210"]].map(x=>`<div class="formgroup"><label>${x[0]}</label><input class="field full" value="${x[1]}"></div>`).join("")}</div><button class="primarybtn" style="margin-top:18px" onclick="toast('Settings saved in demo')">Save settings</button></div><div class="panel"><h2>Appearance</h2><p class="muted">Burgundy Luxury theme · Primary #881337 · Gold #B68D40</p><span class="pill">Active theme</span></div>`,"Settings")}
const vendorLinks=[["vendor-dashboard","▦","Dashboard"],["vendor-products","▣","My products"],["vendor-orders","▥","Orders"],["vendor-inventory","▤","Inventory"],["vendor-earnings","₹","Earnings"],["vendor-profile","♙","Shop profile"],["vendor-support","✉","Support"]];
function vendorLayout(content,title){return `<main class="page"><div class="layout"><aside class="sidebar" id="sideNav"><div class="side-title">Vendor workspace</div>${vendorLinks.map(([p,i,l])=>`<div class="side-link ${activePage===p?"active":""}" onclick="go('${p}')"><span>${i}</span>${l}</div>`).join("")}<div class="side-link" onclick="go('home')">↗ View storefront</div></aside><section class="content"><div class="pagehead"><div><div class="eyebrow">Seller centre</div><h1>${title}</h1></div><button class="outlinebtn mobilemenu" onclick="document.getElementById('sideNav').classList.toggle('open')">☰ Menu</button></div>${content}</section></div></main>`}
function vendorDashboard(){return vendorLayout(`<div class="notice" style="margin-bottom:16px">Your shop is active. Keep your inventory and order status up to date.</div><div class="stats">${[["Gross sales","₹84,590","+14.2%"],["Orders","128","+8 this week"],["Products","42","3 low stock"],["Pending payouts","₹12,450","Next payout 15 Nov"]].map(x=>`<div class="stat"><span class="label">${x[0]}</span><strong>${x[1]}</strong><span class="trend">${x[2]}</span></div>`).join("")}</div><div class="twocol"><div class="panel"><h2>Sales performance</h2><div style="height:170px;display:flex;align-items:end;gap:12px">${[35,55,42,78,62,90,70,100].map((v,i)=>`<div style="flex:1;height:${v}%;background:linear-gradient(var(--secondary),var(--primary));border-radius:6px 6px 0 0"></div>`).join("")}</div><p class="small muted">Last 8 weeks · Demo analytics</p></div><div class="panel"><h2>Quick actions</h2><p><button class="primarybtn" onclick="go('vendor-products')">Manage products</button></p><p><button class="outlinebtn" onclick="go('vendor-orders')">View new orders</button></p><p><button class="outlinebtn" onclick="go('vendor-earnings')">View earnings</button></p></div></div><div class="panel"><h2>Recent orders</h2>${table(["Order","Customer","Date","Amount","Status"],orders.slice(0,3).map(o=>[o.id,o.customer,o.date,money(o.amount),`<span class="status ${statusClass(o.status)}">${o.status}</span>`]))}</div>`,"Dashboard")}
function vendorProducts(){return vendorLayout(`<div class="panel"><div class="toolbar"><input class="field" placeholder="Search your products..." oninput="filterTable(this.value,'vendorProductTable')"><select class="field"><option>All statuses</option><option>Published</option><option>Draft</option><option>Pending approval</option></select><button class="primarybtn" onclick="modal('Add product',productForm())">+ Add product</button></div><div id="vendorProductTable">${table(["Product","Category","Price","Stock","Status","Action"],products.slice(0,6).map((p,i)=>[p.name,p.cat,money(p.price),[24,8,36,12,4,19][i],`<span class="status ${i===4?"amber":"green"}">${i===4?"Low stock":"Published"}</span>`,`<button class="btnsm" onclick="modal('Edit product',productForm())">Edit</button> <button class="btnsm" onclick="toast('Product archived')">Archive</button>`]))}</div></div>`,"My products")}
function productForm(){return `<div class="formgroup"><label>Product name</label><input class="field full" placeholder="Product name"></div><div class="formgrid" style="margin-top:10px"><div class="formgroup"><label>Price</label><input class="field full" type=number placeholder="Price"></div><div class="formgroup"><label>Stock</label><input class="field full" type=number placeholder="Quantity"></div></div><div class="formgroup" style="margin-top:10px"><label>Description</label><textarea class="field full" placeholder="Product description"></textarea></div><button class="primarybtn" style="margin-top:14px" onclick="closeModal();toast('Product saved as draft')">Save product</button>`}
function vendorOrders(){return vendorLayout(`<div class="panel"><div class="toolbar"><input class="field" placeholder="Search orders..." oninput="filterTable(this.value,'vendorOrderTable')"><select class="field"><option>All statuses</option><option>Processing</option><option>Shipped</option><option>Delivered</option></select></div><div id="vendorOrderTable">${table(["Order","Customer","Date","Amount","Status","Action"],orders.map(o=>[o.id,o.customer,o.date,money(o.amount),`<span class="status ${statusClass(o.status)}">${o.status}</span>`,`<button class="btnsm" onclick="modal('Update fulfilment',statusForm('${o.id}'))">Update</button>`]))}</div></div>`,"Orders")}
function vendorInventory(){return vendorLayout(`<div class="stats">${[["Total SKUs","42"],["In stock","35"],["Low stock","5"],["Out of stock","2"]].map(x=>`<div class="stat"><span class="label">${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}</div><div class="panel"><h2>Inventory management</h2>${table(["Product","SKU","Available","Threshold","Status","Action"],products.slice(0,6).map((p,i)=>[p.name,"SS-"+(300+i),[24,8,36,12,4,19][i],10,`<span class="status ${i===4?"amber":"green"}">${i===4?"Low stock":"In stock"}</span>`,`<button class="btnsm" onclick="modal('Update stock','<label>New quantity</label><input class=field type=number value=24><button class=primarybtn onclick=closeModal();toast(&#39;Stock updated&#39;)>Save</button>')">Update</button>`]))}</div>`,"Inventory")}
function vendorEarnings(){return vendorLayout(`<div class="stats">${[["Gross revenue","₹84,590"],["Platform fees","₹4,230"],["Net earnings","₹80,360"],["Available payout","₹12,450"]].map(x=>`<div class="stat"><span class="label">${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}</div><div class="panel"><h2>Payout history</h2>${table(["Payout ID","Date","Amount","Method","Status"],[["PO-501","05 Nov 2026","₹18,400","Bank transfer",'<span class="status green">Paid</span>'],["PO-500","28 Oct 2026","₹14,200","Bank transfer",'<span class="status green">Paid</span>'],["PO-499","15 Oct 2026","₹12,450","Bank transfer",'<span class="status amber">Processing</span>']])}<button class="primarybtn" style="margin-top:15px" onclick="toast('Payout request submitted')">Request payout</button></div>`,"Earnings")}
function vendorProfile(){return vendorLayout(`<div class="panel"><h2>Shop information</h2><div class="formgrid">${[["Shop name","Northstar Store"],["Shop slug","northstar-store"],["Business email","northstar@email.com"],["Phone","9876543210"],["GSTIN","09ABCDE1234F1Z5"],["Business address","Delhi, India"]].map(x=>`<div class="formgroup"><label>${x[0]}</label><input class="field full" value="${x[1]}"></div>`).join("")}</div><button class="primarybtn" style="margin-top:18px" onclick="toast('Shop profile saved')">Save profile</button></div>`,"Shop profile")}
function vendorSupport(){return vendorLayout(`<div class="panel"><div class="pagehead"><h2>Seller support</h2><button class="primarybtn" onclick="modal('Create vendor ticket',ticketForm())">Create ticket</button></div><p class="muted">Contact our seller success team for help with orders, payouts and listings.</p>${table(["Ticket","Subject","Status","Action"],[["VT-81","Payout clarification",'<span class="status amber">Open</span>','<button class="btnsm" onclick="toast(&#39;Ticket opened&#39;)">View</button>'],["VT-79","Product listing approval",'<span class="status green">Resolved</span>','<button class="btnsm">View</button>']])}</div>`,"Support")}
function about(){return `<main class="page"><div class="hero"><div><div class="eyebrow">Our story</div><h1>Good finds.<br>Good feeling.</h1><p>ShopSphere brings together thoughtful products and a smooth shopping experience. This interactive concept showcases the public storefront and all role-based workspaces.</p><button class="primarybtn goldbtn" onclick="go('shop')">Explore products</button></div><div class="heroart">✨</div></div><div class="grid" style="margin-top:24px">${[["Curated quality","Thoughtful products for everyday life."],["Secure shopping","A clear and confident checkout experience."],["Seller community","A dedicated workspace for growing vendors."],["Customer first","Support that stays close when you need it."]].map(x=>`<div class="panel"><h2>${x[0]}</h2><p class="muted">${x[1]}</p></div>`).join("")}</div></main>${footer()}`}
function modal(title,body){document.getElementById("modalRoot").innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div>${body}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function render(){updateCart();let view={home,shop,categories,product:productPage,cart:cartPage,wishlist:wishlistPage,login,register,checkout,"order-success":orderSuccess,about,deals:()=>{filterCat="All";return `<main class="page"><div class="hero"><div><div class="eyebrow">Limited-time offers</div><h1>Little luxuries.<br>Better prices.</h1><p>Discover special prices on customer favourites.</p><button class="primarybtn goldbtn" onclick="go('shop')">Shop offers</button></div><div class="heroart">🏷️</div></div><div class="grid" style="margin-top:24px">${products.filter(p=>p.old>p.price).map(productCard).join("")}</div></main>${footer()}`}, "customer-dashboard":customerDashboard,orders:ordersPage,profile,addresses,notifications,support,chat,returns,"admin-dashboard":adminDashboard,"admin-users":adminUsers,"admin-vendors":adminVendors,"admin-vendor-requests":vendorRequests,"admin-products":adminProducts,"admin-categories":adminCategories,"admin-orders":adminOrders,"admin-refunds":adminRefunds,"admin-payments":adminPayments,"admin-coupons":adminCoupons,"admin-banners":adminBanners,"admin-support":adminSupport,"admin-settings":adminSettings,"vendor-dashboard":vendorDashboard,"vendor-products":vendorProducts,"vendor-orders":vendorOrders,"vendor-inventory":vendorInventory,"vendor-earnings":vendorEarnings,"vendor-profile":vendorProfile,"vendor-support":vendorSupport};document.getElementById("app").innerHTML=(view[activePage]||home)()}
render();
</script>
</body>
</html>
