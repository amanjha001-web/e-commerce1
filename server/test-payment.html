<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ShopSphere - Razorpay Test Payment</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 420px;
      max-width: 90%;
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .amount {
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .details {
      background: #f7f7f7;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .details p {
      margin: 8px 0;
      font-size: 14px;
      word-break: break-all;
    }

    .details strong {
      display: inline-block;
      width: 100px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 10px;
    }

    #result h3 {
      margin-bottom: 12px;
    }

    #result p {
      font-size: 13px;
      margin: 8px 0;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>ShopSphere</h1>

    <p class="subtitle">
      Razorpay Test Checkout
    </p>

    <div class="amount">
      ₹552.00
    </div>

    <div class="details">

      <p>
        <strong>Order ID:</strong>
        order_TQ8UMvs2a8l6zM
      </p>

      <p>
        <strong>Currency:</strong>
        INR
      </p>

      <p>
        <strong>Mode:</strong>
        Test
      </p>

    </div>

    <button id="payButton">
      Pay ₹552
    </button>

    <div id="result">

      <h3>Payment Successful</h3>

      <p>
        <strong>Payment ID:</strong>
        <span id="paymentId"></span>
      </p>

      <p>
        <strong>Order ID:</strong>
        <span id="orderId"></span>
      </p>

      <p>
        <strong>Signature:</strong>
        <span id="signature"></span>
      </p>

    </div>

  </div>

  <script>

    const options = {

      key: "rzp_test_TK1WlLy0FCfImZ",

      amount: 55200,

      currency: "INR",

      name: "ShopSphere",

      description: "ShopSphere Test Payment",

      order_id: "order_TQ8UMvs2a8l6zM",

      handler: function (response) {

        document.getElementById("result").style.display = "block";

        document.getElementById("paymentId").textContent =
          response.razorpay_payment_id;

        document.getElementById("orderId").textContent =
          response.razorpay_order_id;

        document.getElementById("signature").textContent =
          response.razorpay_signature;

        console.log("Payment ID:", response.razorpay_payment_id);
        console.log("Order ID:", response.razorpay_order_id);
        console.log("Signature:", response.razorpay_signature);
      },

      prefill: {
        name: "Test User",
        email: "test@example.com",
        contact: "9999999999"
      },

      theme: {
        color: "#111111"
      }

    };

    const razorpay = new Razorpay(options);

    razorpay.on("payment.failed", function (response) {

      console.error("Payment Failed:", response.error);

      alert(
        "Payment Failed: " +
        response.error.description
      );

    });

    document
      .getElementById("payButton")
      .addEventListener("click", function () {

        razorpay.open();

      });

  </script>

</body>
</html>
